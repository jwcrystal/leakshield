name: Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            out: leakshield-linux
          - os: windows-latest
            target: bun-windows-x64
            out: leakshield.exe
          - os: macos-latest
            target: bun-darwin-arm64
            out: leakshield-macos-arm
          # GitHub retired the macos-13 (Intel) runner; bun cross-compiles x64.
          - os: macos-latest
            target: bun-darwin-x64
            out: leakshield-macos-intel

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Build binary
        run: bun build --compile --target=${{ matrix.target }} ./src/cli.ts --outfile=${{ matrix.out }}
        shell: bash

      - name: Embed icon (Windows)
        if: matrix.os == 'windows-latest'
        run: bun build --compile --target=bun-windows-x64 --windows-icon=icon.ico ./src/cli.ts --outfile=leakshield.exe
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: leakshield-*
          merge-multiple: true

      - name: Package
        run: |
          zip leakshield-${{ github.ref_name }}.zip \
            leakshield.exe leakshield-linux \
            leakshield-macos-arm leakshield-macos-intel

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            leakshield-${{ github.ref_name }}.zip
            leakshield.exe
            leakshield-linux
            leakshield-macos-arm
            leakshield-macos-intel
