# sensitive-guard 自訂規則範例
# 複製到 ~/.sensitive-guard/guard.config.yaml 或 ./config/guard.config.yaml 後啟用

# ─── NDA / 機密關鍵字（大小寫不敏感）────────────────────────
nda_keywords:
  - "CONFIDENTIAL"
  - "INTERNAL ONLY"
  - "DO NOT SHARE"
  - "NDA"
  - "PROPRIETARY"
  - "TRADE SECRET"
  - "secret"
  # ─── 公司內部專案名稱 ───
  - "Project Phoenix"
  # - "Operation XYZ"
  # - "MyCompany Internal"

# ─── 私有域名 ────────────────────────────────────────────
private_domains:
  - "internal.mycompany.com"
  - "corp.mycompany.com"
  # ─── 內部服務域名 ───
  # - "dev.yourcompany.io"
  # - "staging.yourcompany.com"
  # - "jenkins.internal"
  # - "gitlab.corp"

# ─── 自訂正則規則（大小寫不敏感）─────────────────────────────
# severity: HIGH / MEDIUM / LOW（預設 HIGH）
# pattern 上限 200 字元，危險 ReDoS 會自動跳過
custom_rules:
  # ─── 員工／身份編號 ───
  - description: "員工編號"
    pattern: "\\bEMP-\\d{6}\\b"
    severity: HIGH

  - description: "台灣護照號碼"
    pattern: "\\b[A-Z]{1,2}[0-9]{7,9}\\b"
    severity: HIGH

  - description: "台灣統一編號（營利事業）"
    pattern: "\\b[0-9]{8}\\b"
    severity: HIGH

  # ─── 財務／金流 ───
  - description: "信用卡號（Visa／Mastercard）"
    pattern: "\\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14})\\b"
    severity: HIGH

  - description: "台灣銀行帳號（10-14 位數）"
    pattern: "\\b\\d{10,14}\\b"
    severity: MEDIUM

  # ─── 內部系統代號 ───
  - description: "Jira 工單"
    pattern: "\\b[A-Z]{2,10}-\\d{1,6}\\b"
    severity: LOW

  - description: "GitHub Issue 編號"
    pattern: "#\\d{3,6}"
    severity: LOW

  # ─── 客製化敏感值（自定義格式） ───
  - description: "API endpoint 含內部域名"
    pattern: "https?://[a-z-]+\\.corp\\.example\\.com/[\\w-/]+"
    severity: HIGH

  - description: "AWS account ID（12 位數）"
    pattern: "\\b(?:AWS)?[0-9]{12}(?:account)?\\b"
    severity: HIGH

# ─── 掃描設定 ──────────────────────────────────────────
settings:
  # 最大掃描字元數（超過截斷）
  max_chars: 200000
  # 顯示命中行號
  show_line_numbers: true
  # 命中預覽長度
  preview_length: 60
  # 啟用 Base64／URL／Hex 解碼檢測
  # encoding_detection: true
  # 已知 secret value 的來源檔案（路徑相對工作目錄）
  # env_files:
  #   - .env
  #   - .env.local
