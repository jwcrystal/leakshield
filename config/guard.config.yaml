# sensitive-guard 設定檔
# 修改這個檔案來自訂你的 NDA 關鍵字與私有域名

# NDA / 機密關鍵字（大小寫不敏感）
nda_keywords:
  - "CONFIDENTIAL"
  - "INTERNAL ONLY"
  - "DO NOT SHARE"
  - "NDA"
  - "PROPRIETARY"
  - "TRADE SECRET"
  - "secret"
  # 加入你的公司內部關鍵字，例如：
  # - "Project Phoenix"
  # - "Operation XYZ"
  # - "MyCompany Internal"

# 私有域名（只填你公司的內部域名）
private_domains:
  - "internal.mycompany.com"
  - "corp.mycompany.com"
  # 加入你的私有域名，例如：
  # - "dev.yourcompany.io"
  # - "staging.yourcompany.com"

# 自訂規則（使用正則表達式，大小寫不敏感）
# severity 可填 HIGH / MEDIUM / LOW，不填預設 HIGH
# pattern 長度上限 200 字元；危險的 ReDoS pattern 會被自動略過並顯示警告
custom_rules:
# 取消下方範例的註解來啟用自訂規則，例如：
# - description: "員工編號"
#   pattern: "\\bEMP-\\d{6}\\b"
#   severity: HIGH
#
# - description: "台灣護照號碼"
#   pattern: "\\b[A-Z]{1,2}[0-9]{7,9}\\b"
#   severity: HIGH
#
# - description: "信用卡號（Visa / Mastercard）"
#   pattern: "\\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14})\\b"
#   severity: HIGH
#
# - description: "Jira 工單編號"
#   pattern: "\\b[A-Z]{2,10}-\\d{1,6}\\b"
#   severity: LOW

# 掃描設定
settings:
  # 要掃描的最大字元數（超過會截斷，避免掃描太久）
  max_chars: 200000
  # 是否顯示命中的行號
  show_line_numbers: true
  # 命中內容預覽的最大長度（遮蔽敏感值）
  preview_length: 60
