# sensitive-guard 設定檔
# 修改這個檔案來自訂你的 NDA 關鍵字與私有域名

# NDA / 機密關鍵字（大小寫不敏感）
nda_keywords:
  - "CONFIDENTIAL"
  - "INTERNAL ONLY"
  - "DO NOT SHARE"
  - "NDA"
  - "PROPRIETARY"
  - "TRADE SECRET"
  - "secret"
  # 加入你的公司內部關鍵字，例如：
  # - "Project Phoenix"
  # - "Operation XYZ"
  # - "MyCompany Internal"

# 私有域名（只填你公司的內部域名）
private_domains:
  - "internal.mycompany.com"
  - "corp.mycompany.com"
  # 加入你的私有域名，例如：
  # - "dev.yourcompany.io"
  # - "staging.yourcompany.com"

# 掃描設定
settings:
  # 要掃描的最大字元數（超過會截斷，避免掃描太久）
  max_chars: 200000
  # 是否顯示命中的行號
  show_line_numbers: true
  # 命中內容預覽的最大長度（遮蔽敏感值）
  preview_length: 60
