# LeakShield configuration for this repository.
# Edit this file to set your own NDA keywords and private domains.

# NDA / confidential keywords (case-insensitive).
# A keyword that starts and ends with an ASCII letter or digit matches whole
# words only ("NDA" does not match "Foundation" or "agenda"); CJK keywords such
# as "機密" match as substrings.
# Listing keywords replaces the built-in defaults (CONFIDENTIAL, INTERNAL ONLY,
# DO NOT SHARE, NDA); an empty list disables NDA keywords; omitting the key
# keeps the defaults.
nda_keywords: []
  # Add your own internal keywords, for example:
  # - "Project Phoenix"
  # - "Operation XYZ"

# Private domains (only your organization's or project's internal hosts;
# remove placeholders that do not apply).
# Substring match, case-insensitive; a full hostname reduces false matches.
private_domains: []
  # Add your private domains, for example:
  # - "internal.example.com"
  # - "corp.example.com"

# Custom rules (regular expressions, case-insensitive).
# severity: HIGH / MEDIUM / LOW (default HIGH).
# A pattern may be up to 200 characters. A pattern that does not compile makes
# the config fail to load; a pattern that looks like ReDoS is skipped with a
# warning (timing heuristic, not a guarantee), and --doctor lists it.
custom_rules: []
# Every custom regex match is a finding; LOW does not mean ignored or allowed.
# Generic number patterns cause false positives: check them against your real
# data before uncommenting.
# - description: "Employee ID"
#   pattern: "\\bEMP-\\d{6}\\b"
#   severity: HIGH
#
# Credit card numbers are already covered by a built-in rule (id: credit-card,
# with a Luhn check); no custom rule is needed.
#
# Jira issue keys are usually not confidential; LOW still produces a finding,
# so enable this only when you need it:
# - description: "Jira issue key"
#   pattern: "\\b[A-Z]{2,10}-\\d{1,6}\\b"
#   severity: LOW

# Scan settings
settings:
  # Maximum characters to scan (longer input is truncated so scans stay fast).
  max_chars: 200000
  # Show line numbers for findings.
  show_line_numbers: true
  # Maximum length of the masked finding preview.
  preview_length: 60
  # Base64 / URL / Hex decoding detection; off by default, enable explicitly.
  encoding_detection: false
  # Files holding known secret values. Not read by default; paths are relative
  # to the project root. Only non-empty values of at least 8 characters are
  # used for exact matching; they are never sent, logged or serialized.
  # env_files:
  #   - .env
  #   - .env.local
  # Turn individual built-in rules on or off (ids in src/rules/builtin.ts; an
  # unknown id fails the load). Opt-in rules (such as url) are off by default;
  # the others are on and can be turned off here:
  # rule_overrides:
  #   url: true
  #   phone-intl: false
