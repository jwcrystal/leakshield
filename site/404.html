<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — LeakShield</title>
<link rel="icon" href="/leakshield/assets/icon-small.svg" type="image/svg+xml">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fffdf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('leakshield-theme'); } catch (e) {}
    var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<style>
  :root {
    --bg: #fffdf9;
    --fg: #1c1917;
    --muted: #57534e;
    --accent: #0f766e;
  }
  html[data-theme="dark"] {
    --bg: #141311;
    --fg: #ece9e2;
    --muted: #c8c2b9;
    --accent: #2dd4bf;
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    background: var(--bg); color: var(--fg); text-align: center; padding: 2rem;
    -webkit-font-smoothing: antialiased;
  }
  img { width: 56px; height: 56px; }
  h1 { font-size: 1.5rem; letter-spacing: -.02em; margin: 1rem 0 .5rem; }
  p { margin: 0 0 1.4rem; color: var(--muted); font-size: .95rem; line-height: 1.6; }
  a {
    display: inline-block; padding: .65rem 1.15rem; border-radius: 10px;
    background: var(--fg); color: var(--bg);
    text-decoration: none; font-size: .9rem; font-weight: 600;
  }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <img src="/leakshield/assets/icon.svg" alt="">
    <h1 id="t">404 — Page not found</h1>
    <p id="d">There is nothing at this path.</p>
    <a id="cta" href="/leakshield/">Back to LeakShield</a>
  </main>
  <script>
    (function () {
      var lang = null;
      try { lang = localStorage.getItem('leakshield-lang'); } catch (e) {}
      if (!lang) lang = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
      if (lang === 'zh') {
        document.documentElement.lang = 'zh-Hant-TW';
        document.title = '找不到頁面 — LeakShield';
        document.getElementById('t').textContent = '404 — 找不到這個頁面';
        document.getElementById('d').textContent = '此路徑上沒有內容。';
        document.getElementById('cta').textContent = '回到 LeakShield 首頁';
      }
    })();
  </script>
</body>
</html>
