<svg xmlns="http://www.w3.org/2000/svg" width="640" height="608" viewBox="0 0 640 608" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="640" height="608" fill="#0b1220"/>

  <!-- local boundary -->
  <rect x="8" y="8" width="624" height="422" rx="14" fill="#101a2e" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="22" y="25" font-size="8.5" letter-spacing="1.4" fill="#94a3b8">LOCAL MACHINE</text>

  <!-- host row -->
  <rect x="16" y="36" width="144" height="62" rx="8" fill="#94a3b8" fill-opacity=".12" stroke="#94a3b8"/>
  <text x="88" y="57" text-anchor="middle" font-size="12" font-weight="600" fill="#f1f5f9">OpenCode v2</text>
  <text x="88" y="71" text-anchor="middle" font-size="9.5" fill="#cbd5e1">plugin · primary</text>
  <text x="88" y="84" text-anchor="middle" font-size="9.5" fill="#cbd5e1">in-process hooks</text>

  <rect x="172" y="36" width="144" height="62" rx="8" fill="#94a3b8" fill-opacity=".12" stroke="#94a3b8"/>
  <text x="244" y="57" text-anchor="middle" font-size="12" font-weight="600" fill="#f1f5f9">pi</text>
  <text x="244" y="71" text-anchor="middle" font-size="9.5" fill="#cbd5e1">extension · verified</text>
  <text x="244" y="84" text-anchor="middle" font-size="9.5" fill="#cbd5e1">wraps fetch</text>

  <rect x="328" y="36" width="144" height="62" rx="8" fill="#94a3b8" fill-opacity=".12" stroke="#94a3b8"/>
  <text x="400" y="57" text-anchor="middle" font-size="12" font-weight="600" fill="#f1f5f9">Claude Code</text>
  <text x="400" y="71" text-anchor="middle" font-size="9.5" fill="#cbd5e1">proxy · experimental</text>
  <text x="400" y="84" text-anchor="middle" font-size="9.5" fill="#cbd5e1">no request-layer hook</text>

  <rect x="484" y="36" width="140" height="62" rx="8" fill="#94a3b8" fill-opacity=".12" stroke="#334155"/>
  <text x="554" y="57" text-anchor="middle" font-size="12" font-weight="600" fill="#cbd5e1">CLI / Web</text>
  <text x="554" y="71" text-anchor="middle" font-size="9.5" fill="#cbd5e1">uses scanner + decision</text>
  <text x="554" y="84" text-anchor="middle" font-size="9.5" fill="#94a3b8">not a model boundary</text>

  <!-- host arrows -->
  <path d="M88 98 V126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a-slate)"/>
  <path d="M244 98 V126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a-slate)"/>
  <path d="M400 98 V126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a-slate)"/>

  <!-- interception layer -->
  <rect x="16" y="126" width="300" height="112" rx="9" fill="#2dd4bf" fill-opacity=".14" stroke="#14b8a6"/>
  <text x="30" y="148" font-size="12" font-weight="600" fill="#2dd4bf">In-process hooks &amp; final wire</text>
  <text x="30" y="163" font-size="9.5" fill="#cbd5e1">src/adapters/opencode · src/adapters/pi</text>
  <text x="30" y="184" font-size="10" fill="#f1f5f9">mask: input · history · system · tool results</text>
  <text x="30" y="201" font-size="10" fill="#f1f5f9">restore: tool args · assistant text</text>
  <text x="30" y="218" font-size="10" fill="#f1f5f9">final wire: provider JSON · SSE · WS frames</text>

  <rect x="328" y="126" width="296" height="112" rx="9" fill="#60a5fa" fill-opacity=".14" stroke="#3b82f6"/>
  <text x="342" y="148" font-size="12" font-weight="600" fill="#60a5fa">Local HTTP proxy</text>
  <text x="342" y="163" font-size="9.5" fill="#cbd5e1">src/adapters/claude-code · ANTHROPIC_BASE_URL</text>
  <text x="342" y="184" font-size="10" fill="#f1f5f9">mask the whole /v1/messages body</text>
  <text x="342" y="201" font-size="10" fill="#f1f5f9">restore assistant text (JSON &amp; SSE)</text>
  <text x="342" y="218" font-size="10" fill="#f1f5f9">unknown route or block → 400, never forwarded</text>

  <!-- merge into core -->
  <path d="M166 238 V248 H476 V238" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M222 248 V258" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a-slate)"/>

  <!-- core -->
  <rect x="16" y="258" width="412" height="160" rx="10" fill="#60a5fa" fill-opacity=".12" stroke="#3b82f6"/>
  <text x="32" y="282" font-size="13" font-weight="600" fill="#93c5fd">LeakShield Core — model-request layer</text>
  <text x="32" y="296" font-size="9.5" fill="#cbd5e1">host-independent · wire · session · mapping — src/core + src/decision</text>
  <text x="32" y="316" font-size="10.2" fill="#f1f5f9">Wire: chat-completions · Responses · Anthropic Messages · WS</text>
  <text x="32" y="332" font-size="10.2" fill="#f1f5f9">Session: per-session placeholders · isolation · capacity bounds</text>
  <text x="32" y="348" font-size="10.2" fill="#f1f5f9">Mapping: SGP2 pseudonymizer · encrypted store · keychain custody</text>
  <text x="32" y="364" font-size="10.2" fill="#f1f5f9">Tools: per-field restore policy · embedded tokens (curl / http)</text>
  <text x="32" y="380" font-size="10.2" fill="#f1f5f9">Fail-closed: anything unrecognised is refused, never forwarded</text>
  <text x="32" y="400" font-size="10" fill="#94a3b8">Placeholders are local-only; the reverse mapping never leaves the machine.</text>

  <!-- detection -->
  <rect x="440" y="258" width="184" height="160" rx="10" fill="#a78bfa" fill-opacity=".12" stroke="#8b5cf6"/>
  <text x="454" y="282" font-size="12" font-weight="600" fill="#c4b5fd">Detection &amp; policy</text>
  <text x="454" y="296" font-size="9.5" fill="#cbd5e1">src/scanner · src/rules</text>
  <text x="454" y="316" font-size="10" fill="#f1f5f9">config/guard.config.yaml</text>
  <text x="454" y="332" font-size="10" fill="#f1f5f9">built-in rules</text>
  <text x="454" y="348" font-size="10" fill="#f1f5f9">dynamic keywords / domains</text>
  <text x="454" y="364" font-size="10" fill="#f1f5f9">exact .env values</text>
  <text x="454" y="380" font-size="10" fill="#f1f5f9">allowlists</text>
  <text x="454" y="400" font-size="10" fill="#c4b5fd">ALLOW / WARN / CONFIRM</text>
  <text x="454" y="413" font-size="8.5" fill="#94a3b8">used by all four entry points</text>
  <path d="M440 338 H432" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#a-violet)"/>

  <!-- provider -->
  <path d="M222 418 V448" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-slate)"/>
  <rect x="16" y="448" width="608" height="58" rx="9" fill="#94a3b8" fill-opacity=".16" stroke="#94a3b8"/>
  <text x="320" y="470" text-anchor="middle" font-size="12" font-weight="600" fill="#f1f5f9">Any supported model provider</text>
  <text x="320" y="486" text-anchor="middle" font-size="10" fill="#cbd5e1">Anthropic · OpenAI-compatible · custom base URL — masked requests only</text>

  <!-- not covered -->
  <rect x="16" y="528" width="608" height="64" rx="9" fill="#fbbf24" fill-opacity=".10" stroke="#f59e0b" stroke-dasharray="4 3"/>
  <text x="32" y="546" font-size="9.5" font-weight="600" letter-spacing="0.8" fill="#fbbf24">NOT COVERED</text>
  <text x="32" y="563" font-size="10" fill="#cbd5e1">telemetry &amp; error reporting · Bedrock / Vertex / Foundry · WebFetch preflight</text>
  <text x="32" y="579" font-size="10" fill="#cbd5e1">cloud sessions · direct provider bypass · on-disk transcripts &amp; logs</text>
</svg>
