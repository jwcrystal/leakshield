<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 440" role="img" aria-labelledby="title desc"><title id="title">How LeakShield masks model requests</title><desc id="desc">LeakShield masks detected sensitive values in intercepted requests. The reverse mapping stays local. Restoration varies by integration.</desc><style>text{font:13px system-ui,sans-serif;fill:#ece9e2}.h{font-size:16px;font-weight:700}.a{fill:#2dd4bf;font-weight:700}.card{fill:#23201c;stroke:#78716c}.line{fill:none;stroke:#2dd4bf;stroke-width:1.6}</style><path fill="#141311" d="M0 0H460V440H0Z"/><rect x="12" y="12" width="436" height="238" rx="12" fill="#1b1916" stroke="#78716c" stroke-dasharray="5 4"/><text x="26" y="34">LOCAL MACHINE</text><rect class="card" x="26" y="46" width="408" height="48" rx="8"/><text x="230" y="76" text-anchor="middle" class="h">OpenCode · Pi · Claude Code</text><path class="line" d="M230 94V116m-5-5 5 5 5-5"/><rect x="26" y="116" width="408" height="118" rx="8" fill="#20332e" stroke="#2dd4bf"/><text x="40" y="141" class="h">LeakShield Guard</text><text x="40" y="164">Replace detected sensitive values with placeholders.</text><text x="40" y="186" class="a">Reverse mapping stays local.</text><text x="40" y="211">Restore locally · Restoration varies by integration.</text><path class="line" d="M181 234V293m-5-5 5 5 5-5"/><text x="169" y="275" text-anchor="end" class="a">Masked request</text><path class="line" stroke-dasharray="4 3" d="M269 293V234m-5 5 5-5 5 5"/><text x="282" y="275">Response</text><rect class="card" x="26" y="293" width="408" height="48" rx="8"/><text x="230" y="323" text-anchor="middle" class="h">Supported model provider</text><rect x="26" y="358" width="408" height="66" rx="8" fill="#2b2315" stroke="#fbbf24" stroke-dasharray="4 3"/><text x="40" y="379" class="h">Not covered</text><text x="40" y="398">Unintercepted traffic · Tool network traffic</text><text x="40" y="415">On-disk transcripts and logs</text></svg>
