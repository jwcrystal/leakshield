<svg xmlns="http://www.w3.org/2000/svg" width="640" height="608" viewBox="0 0 640 608" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0d9488"/>
    </marker>
    <marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="640" height="608" fill="#ffffff"/>

  <!-- local boundary -->
  <rect x="8" y="8" width="624" height="422" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="22" y="25" font-size="8.5" letter-spacing="1.4" fill="#64748b">LOCAL MACHINE</text>

  <!-- host row -->
  <rect x="16" y="36" width="144" height="62" rx="8" fill="#64748b" fill-opacity=".07" stroke="#94a3b8"/>
  <text x="88" y="57" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">OpenCode v2</text>
  <text x="88" y="71" text-anchor="middle" font-size="9.5" fill="#475569">plugin · primary</text>
  <text x="88" y="84" text-anchor="middle" font-size="9.5" fill="#475569">in-process hooks</text>

  <rect x="172" y="36" width="144" height="62" rx="8" fill="#64748b" fill-opacity=".07" stroke="#94a3b8"/>
  <text x="244" y="57" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">pi</text>
  <text x="244" y="71" text-anchor="middle" font-size="9.5" fill="#475569">extension · verified</text>
  <text x="244" y="84" text-anchor="middle" font-size="9.5" fill="#475569">wraps fetch</text>

  <rect x="328" y="36" width="144" height="62" rx="8" fill="#64748b" fill-opacity=".07" stroke="#94a3b8"/>
  <text x="400" y="57" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Claude Code</text>
  <text x="400" y="71" text-anchor="middle" font-size="9.5" fill="#475569">proxy · experimental</text>
  <text x="400" y="84" text-anchor="middle" font-size="9.5" fill="#475569">no request-layer hook</text>

  <rect x="484" y="36" width="140" height="62" rx="8" fill="#64748b" fill-opacity=".035" stroke="#cbd5e1"/>
  <text x="554" y="57" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">CLI / Web</text>
  <text x="554" y="71" text-anchor="middle" font-size="9.5" fill="#475569">uses scanner + decision</text>
  <text x="554" y="84" text-anchor="middle" font-size="9.5" fill="#64748b">not a model boundary</text>

  <!-- host arrows -->
  <path d="M88 98 V126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a-slate)"/>
  <path d="M244 98 V126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a-slate)"/>
  <path d="M400 98 V126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a-slate)"/>

  <!-- interception layer -->
  <rect x="16" y="126" width="300" height="112" rx="9" fill="#0d9488" fill-opacity=".06" stroke="#5eead4"/>
  <text x="30" y="148" font-size="12" font-weight="600" fill="#0d9488">In-process hooks &amp; final wire</text>
  <text x="30" y="163" font-size="9.5" fill="#475569">src/adapters/opencode · src/adapters/pi</text>
  <text x="30" y="184" font-size="10" fill="#0f172a">mask: input · history · system · tool results</text>
  <text x="30" y="201" font-size="10" fill="#0f172a">restore: tool args · assistant text</text>
  <text x="30" y="218" font-size="10" fill="#0f172a">final wire: provider JSON · SSE · WS frames</text>

  <rect x="328" y="126" width="296" height="112" rx="9" fill="#2563eb" fill-opacity=".06" stroke="#93c5fd"/>
  <text x="342" y="148" font-size="12" font-weight="600" fill="#2563eb">Local HTTP proxy</text>
  <text x="342" y="163" font-size="9.5" fill="#475569">src/adapters/claude-code · ANTHROPIC_BASE_URL</text>
  <text x="342" y="184" font-size="10" fill="#0f172a">mask the whole /v1/messages body</text>
  <text x="342" y="201" font-size="10" fill="#0f172a">restore assistant text (JSON &amp; SSE)</text>
  <text x="342" y="218" font-size="10" fill="#0f172a">unknown route or block → 400, never forwarded</text>

  <!-- merge into core -->
  <path d="M166 238 V248 H476 V238" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M222 248 V258" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a-slate)"/>

  <!-- core -->
  <rect x="16" y="258" width="412" height="160" rx="10" fill="#2563eb" fill-opacity=".05" stroke="#3b82f6"/>
  <text x="32" y="282" font-size="13" font-weight="600" fill="#1d4ed8">LeakShield Core — model-request layer</text>
  <text x="32" y="296" font-size="9.5" fill="#475569">host-independent · wire · session · mapping — src/core + src/decision</text>
  <text x="32" y="316" font-size="10.2" fill="#0f172a">Wire: chat-completions · Responses · Anthropic Messages · WS</text>
  <text x="32" y="332" font-size="10.2" fill="#0f172a">Session: per-session placeholders · isolation · capacity bounds</text>
  <text x="32" y="348" font-size="10.2" fill="#0f172a">Mapping: SGP2 pseudonymizer · encrypted store · keychain custody</text>
  <text x="32" y="364" font-size="10.2" fill="#0f172a">Tools: per-field restore policy · embedded tokens (curl / http)</text>
  <text x="32" y="380" font-size="10.2" fill="#0f172a">Fail-closed: anything unrecognised is refused, never forwarded</text>
  <text x="32" y="400" font-size="10" fill="#64748b">Placeholders are local-only; the reverse mapping never leaves the machine.</text>

  <!-- detection -->
  <rect x="440" y="258" width="184" height="160" rx="10" fill="#7c3aed" fill-opacity=".05" stroke="#c4b5fd"/>
  <text x="454" y="282" font-size="12" font-weight="600" fill="#6d28d9">Detection &amp; policy</text>
  <text x="454" y="296" font-size="9.5" fill="#475569">src/scanner · src/rules</text>
  <text x="454" y="316" font-size="10" fill="#0f172a">config/guard.config.yaml</text>
  <text x="454" y="332" font-size="10" fill="#0f172a">built-in rules</text>
  <text x="454" y="348" font-size="10" fill="#0f172a">dynamic keywords / domains</text>
  <text x="454" y="364" font-size="10" fill="#0f172a">exact .env values</text>
  <text x="454" y="380" font-size="10" fill="#0f172a">allowlists</text>
  <text x="454" y="400" font-size="10" fill="#6d28d9">ALLOW / WARN / CONFIRM</text>
  <text x="454" y="413" font-size="8.5" fill="#64748b">used by all four entry points</text>
  <path d="M440 338 H432" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#a-violet)"/>

  <!-- provider -->
  <path d="M222 418 V448" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a-slate)"/>
  <rect x="16" y="448" width="608" height="58" rx="9" fill="#64748b" fill-opacity=".08" stroke="#94a3b8"/>
  <text x="320" y="470" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Any supported model provider</text>
  <text x="320" y="486" text-anchor="middle" font-size="10" fill="#475569">Anthropic · OpenAI-compatible · custom base URL — masked requests only</text>

  <!-- not covered -->
  <rect x="16" y="528" width="608" height="64" rx="9" fill="#b45309" fill-opacity=".04" stroke="#f59e0b" stroke-dasharray="4 3"/>
  <text x="32" y="546" font-size="9.5" font-weight="600" letter-spacing="0.8" fill="#b45309">NOT COVERED</text>
  <text x="32" y="563" font-size="10" fill="#475569">telemetry &amp; error reporting · Bedrock / Vertex / Foundry · WebFetch preflight</text>
  <text x="32" y="579" font-size="10" fill="#475569">cloud sessions · direct provider bypass · on-disk transcripts &amp; logs</text>
</svg>
