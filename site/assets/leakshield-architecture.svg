<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 670" role="img" aria-labelledby="title desc"><title id="title">LeakShield technical architecture</title><desc id="desc">Supported model requests pass through LeakShield. Detected sensitive values are replaced with placeholders; the reverse mapping stays local. CLI and Web scan independently.</desc><style>text{font:12px system-ui,sans-serif;fill:#1c1917}.h{font-size:15px;font-weight:700}.a{fill:#0f766e;font-weight:700}.m{fill:#57534e}.card{fill:#fffdf9;stroke:#a8a29e}.flow{fill:none;stroke:#0f766e;stroke-width:1.6;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker></defs><path fill="#fffdf9" d="M0 0H760V670H0Z"/><rect x="12" y="12" width="736" height="444" rx="12" fill="#f3efe9" stroke="#a8a29e" stroke-dasharray="5 4"/><text x="26" y="34" class="m">LOCAL MACHINE</text><g class="card"><rect x="24" y="46" width="169" height="60" rx="8"/><rect x="205" y="46" width="169" height="60" rx="8"/><rect x="386" y="46" width="169" height="60" rx="8"/><rect x="567" y="46" width="169" height="60" rx="8"/><rect x="24" y="132" width="350" height="125" rx="8"/><rect x="386" y="132" width="350" height="125" rx="8"/><rect x="24" y="284" width="466" height="160" rx="8"/><rect x="510" y="284" width="226" height="160" rx="8"/><rect x="24" y="502" width="712" height="54" rx="8"/></g><text x="38" y="70" class="h">OpenCode v2</text><text x="38" y="90">Plugin</text><text x="219" y="70" class="h">Pi</text><text x="219" y="90">Extension · wraps fetch</text><text x="400" y="70" class="h">Claude Code</text><text x="400" y="90">Experimental proxy</text><text x="581" y="70" class="h">CLI / Web</text><text x="581" y="90">Standalone scanners</text><path class="flow" d="M108 106V132"/><path class="flow" d="M289 106V132"/><path class="flow" d="M470 106V132"/><text x="38" y="155" class="h">In-process interception</text><text x="38" y="175" class="m">src/adapters/opencode · src/adapters/pi</text><text x="38" y="196">Mask: input, history, system prompts, tool results</text><text x="38" y="216">Restore: assistant text and supported tool arguments</text><text x="38" y="236">Wire coverage depends on host and configuration</text><text x="400" y="155" class="h">Local HTTP proxy</text><text x="400" y="175" class="m">src/adapters/claude-code · ANTHROPIC_BASE_URL</text><text x="400" y="196">Mask: Messages and token-count request bodies</text><text x="400" y="216">Restores assistant text, not tool arguments</text><text x="400" y="236">Blocked proxy requests return HTTP 400</text><path fill="none" stroke="#0f766e" d="M199 257V270H561V257"/><path class="flow" d="M257 270V284"/><text x="38" y="309" class="h">LeakShield Core · model-request layer</text><text x="38" y="331">Wire: Chat Completions, Responses, Messages, supported WS</text><text x="38" y="353">Session-scoped placeholders and capacity limits</text><text x="38" y="375">Fail-closed: block intercepted requests if masking fails</text><text x="38" y="404" class="a">Detected sensitive values become placeholders.</text><text x="38" y="426" class="a">The reverse mapping stays local.</text><text x="524" y="309" class="h">Detection &amp; policy</text><text x="524" y="331">config/guard.config.yaml</text><text x="524" y="353">Built-in rules, keywords, domains</text><text x="524" y="375">Exact .env values and allowlists</text><text x="524" y="407" class="a">ALLOW / WARN / CONFIRM</text><path class="flow" d="M510 359H490"/><path class="flow" d="M215 444V502"/><text x="202" y="480" text-anchor="end" class="a">Masked request</text><path class="flow" d="M301 502V444" stroke-dasharray="4 3"/><text x="314" y="480">Response</text><text x="380" y="525" text-anchor="middle" class="h">Supported model provider</text><text x="380" y="545" text-anchor="middle">Anthropic · OpenAI-compatible · Custom base URL</text><rect x="24" y="574" width="712" height="80" rx="8" fill="#faf0db" stroke="#92400e" stroke-dasharray="4 3"/><text x="38" y="595" class="h">Not covered</text><text x="38" y="616">Unintercepted traffic · Tool network traffic · On-disk transcripts and logs</text><text x="38" y="637">Claude Code proxy bypasses: telemetry, WebFetch preflight, cloud sessions, Bedrock / Vertex / Foundry</text></svg>
